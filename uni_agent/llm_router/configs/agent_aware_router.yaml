# Agent-cache-aware router — external plugin config (FQN injection).
#
# Loaded by verl through its ``router_config_path``:
#   rollout.router_config_path: pkg://uni_agent.llm_router.configs/router.yaml
# The top-level ``router_class`` FQN is imported and instantiated with this
# YAML's full content as ``config``. Mirrors the shape of verl router-dev's
# rollout/router/kvcaware.yaml (single merged file, no Hydra defaults split),
# with the FQN anchor + _target_ FQN retargeted to the uni_agent package.

router_class: uni_agent.llm_router.balancer.KVCAwareBalancer

# strategies is a LIST here (KVCAwareConfig._extract_strategies accepts list or
# dict). Each item MUST carry _target_ — from_config hydra-instantiates it.
strategies:
  - _target_: uni_agent.llm_router.config.strategy.KVCAwareStrategyConfig
    # overload when load > threshold (load ∈ [0,1], bigger = more loaded)
    load_threshold: 0.9
